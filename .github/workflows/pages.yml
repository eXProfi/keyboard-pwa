name: Deploy Russian Keyboard PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate production files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "site/index.html"
            "site/manifest.webmanifest"
            "site/service-worker.js"
            "site/apple-touch-icon.png"
            "site/icon-192.png"
            "site/icon-512.png"
            "site/icon-maskable-512.png"
            "site/.nojekyll"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required PWA files are present."

      - name: Set Service Worker cache version
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" site/service-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
