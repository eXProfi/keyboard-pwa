<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f2f2f7" />

  <!-- PWA / iPad Home Screen -->
  <meta name="application-name" content="Русская клавиатура" />
  <meta name="apple-mobile-web-app-title" content="Клавиатура" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <title></title>

  <link rel="stylesheet" href="./src/styles.css" />
</head>

<body>
  <main id="app">

    <section class="text-bar" aria-label="Строка набранного текста">

      <div
        id="textOutput"
        class="empty"
        aria-live="polite"
      ></div>

      <button
        id="backspaceButton"
        class="top-control"
        type="button"
        data-action-id="backspace"
        aria-label="Удалить последний символ"
        title="Удалить последний символ"
      >
        ⌫
      </button>

      <button
        id="clearButton"
        class="top-control clear"
        type="button"
        data-action-id="clear"
        aria-label="Очистить весь текст"
        title="Очистить весь текст"
      >
        Очистить
      </button>

    </section>

    <section
      id="keyboardArea"
      aria-label="Русская клавиатура"
    >

      <div
        id="numbersKeyboard"
        aria-label="Цифры"
      ></div>

      <button
        id="upperSpaceButton"
        class="key space-key upper-space-key"
        type="button"
        data-action-id="space:upper"
        aria-label="Пробел"
        title="Пробел"
      >
        ПРОБЕЛ
      </button>

      <div
        id="lettersKeyboard"
        aria-label="Русский алфавит"
      ></div>

      <div class="bottom-controls"><button
        id="spaceButton"
        class="key space-key"
        type="button"
        data-action-id="space"
        aria-label="Пробел"
        title="Пробел"
      >
        ПРОБЕЛ
      </button>

      <button
        id="settingsButton"
        class="top-control settings-control"
        type="button"
        data-action-id="settings"
        aria-haspopup="dialog"
        aria-controls="settingsDialog"
        aria-label=""
        title=""
      ></button>
</div>

    </section>

  </main>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-panel">
      <header class="settings-header">
        <h2 id="settingsTitle"></h2>
        <button id="closeSettings" type="button" data-action-id="closeSettings" class="close-settings" aria-label="" title="">×</button>
      </header>
      <div class="settings-body">
        <label id="uiLanguageLabel" for="uiLocale"></label>
        <select id="uiLocale" data-action-id="uiLocale"></select>
        <label id="keyboardLayoutLabel" for="keyboardLayoutId"></label>
        <select id="keyboardLayoutId" data-action-id="keyboardLayoutId"></select>
        <p id="settingsStatus" role="status" aria-live="polite" hidden></p>
        <section class="bridge-panel" aria-labelledby="bridgeTitle">
          <h3 id="bridgeTitle"></h3>
          <p id="bridgeHelp"></p>
          <label id="bridgeCodeLabel" for="bridgeCode"></label>
          <input id="bridgeCode" data-action-id="bridgeCode" type="text" autocomplete="off" spellcheck="false" aria-describedby="bridgeHelp" />
          <div class="bridge-actions">
            <button id="bridgeConnect" type="button" data-action-id="bridgeConnect"></button>
            <button id="bridgeDisconnect" type="button" data-action-id="bridgeDisconnect"></button>
          </div>
          <p id="bridgeStatus" role="status" aria-live="polite"></p>
        </section>
        <section class="bridge-panel license-panel" aria-labelledby="licenseTitle">
          <h3 id="licenseTitle"></h3>
          <p id="licenseNotice"></p>
          <a id="licenseLink" href="./LICENSE.txt" target="_blank" rel="noopener"></a>
        </section>
      </div>
    </div>
  </dialog>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
