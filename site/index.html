<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f2f2f7" />

  <!-- PWA / iPad Home Screen -->
  <meta name="application-name" content="Patient keyboard" />
  <meta name="apple-mobile-web-app-title" content="Keyboard" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <title></title>

  <link rel="stylesheet" href="./src/styles.css" />
</head>

<body>
  <main id="app">

    <section class="text-bar" aria-label="Text input area">

      <div
        id="textOutput"
        class="empty"
        aria-live="polite"
      ></div>

      <button
        id="backspaceButton"
        class="top-control"
        type="button"
        data-action-id="backspace"
        aria-label="Backspace"
        title="Backspace"
      >
        ⌫
      </button>

      <button
        id="clearButton"
        class="top-control clear"
        type="button"
        data-action-id="clear"
        aria-label="Clear"
        title="Clear"
      >
        Clear
      </button>

    </section>

    <section
      id="keyboardArea"
      aria-label="Keyboard"
    >

      <div
        id="numbersKeyboard"
        aria-label="Numbers"
      ></div>

      <button
        id="upperSpaceButton"
        class="key space-key upper-space-key"
        type="button"
        data-action-id="space:upper"
        aria-label="Space"
        title="Space"
      >
        SPACE
      </button>

      <div
        id="lettersKeyboard"
        aria-label="Letters"
      ></div>

      <div class="bottom-controls"><button
        id="spaceButton"
        class="key space-key"
        type="button"
        data-action-id="space"
        aria-label="Space"
        title="Space"
      >
        SPACE
      </button>

      <button
        id="settingsButton"
        class="top-control settings-control"
        type="button"
        data-action-id="settings"
        aria-haspopup="dialog"
        aria-controls="settingsDialog"
        aria-label=""
        title=""
      ><span class="settings-icon" aria-hidden="true"></span></button>
</div>

    </section>

  </main>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-panel">
      <header class="settings-header">
        <h2 id="settingsTitle"></h2>
        <button id="closeSettings" type="button" data-action-id="closeSettings" class="close-settings" aria-label="" title="">×</button>
      </header>
      <div class="settings-body">
        <label id="uiLanguageLabel" for="uiLocale"></label>
        <div class="language-picker">
          <button id="uiLocale" type="button" class="language-trigger" data-action-id="uiLocale" aria-haspopup="listbox" aria-expanded="false" aria-controls="uiLocaleList" aria-labelledby="uiLanguageLabel uiLocale"></button>
          <div id="uiLocaleList" class="language-list" role="listbox" tabindex="-1" aria-labelledby="uiLanguageLabel" hidden></div>
        </div>
        <label id="keyboardLayoutLabel" for="keyboardLayoutId"></label>
        <div class="language-picker">
          <button id="keyboardLayoutId" type="button" class="language-trigger" data-action-id="keyboardLayoutId" aria-haspopup="listbox" aria-expanded="false" aria-controls="keyboardLayoutIdList" aria-labelledby="keyboardLayoutLabel keyboardLayoutId"></button>
          <div id="keyboardLayoutIdList" class="language-list" role="listbox" tabindex="-1" aria-labelledby="keyboardLayoutLabel" hidden></div>
        </div>
        <p id="settingsStatus" role="status" aria-live="polite" hidden></p>
        <section class="bridge-panel" aria-labelledby="bridgeTitle">
          <h3 id="bridgeTitle"></h3>
          <p id="bridgeHelp"></p>
          <label id="bridgeCodeLabel" for="bridgeCode"></label>
          <input id="bridgeCode" data-action-id="bridgeCode" type="text" autocomplete="off" spellcheck="false" aria-describedby="bridgeHelp" />
          <div class="bridge-actions">
            <button id="bridgeConnect" type="button" data-action-id="bridgeConnect"></button>
            <button id="bridgeDisconnect" type="button" data-action-id="bridgeDisconnect"></button>
          </div>
          <p id="bridgeStatus" role="status" aria-live="polite"></p>
        </section>
        <section class="bridge-panel credits-panel" aria-labelledby="creditsTitle">
          <h3 id="creditsTitle"></h3>
          <p id="creditsNotice"></p>
          <!-- Add one <li> per person: name and GitHub profile link.
               Names are not translated; only the role label is localized. -->
          <ul class="credits-list">
            <li><span data-credit-role="author"></span>: <bdi>eXProfi</bdi> — <a href="https://github.com/eXProfi" target="_blank" rel="noopener">github.com/eXProfi</a></li>
          </ul>
        </section>
        <section class="bridge-panel license-panel" aria-labelledby="licenseTitle">
          <h3 id="licenseTitle"></h3>
          <p id="licenseNotice"></p>
          <a id="licenseLink" href="./LICENSE.txt" target="_blank" rel="noopener"></a>
        </section>
      </div>
    </div>
  </dialog>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
